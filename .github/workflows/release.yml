name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for npm provenance: the OIDC token is what proves this tarball
      # was built by this workflow from this commit. No long-lived NPM_TOKEN is
      # stored anywhere.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Install reference tools for interop tests
        run: sudo apt-get update && sudo apt-get install -y ffmpeg flac

      - run: npm run build
      - run: npm run check

      # npm 11.5+ exchanges the GitHub OIDC token for a short-lived publish
      # credential, so no long-lived NPM_TOKEN is stored anywhere. Configure the
      # trusted publisher once at
      # npmjs.com/package/audiobox/access -> Trusted Publisher,
      # pointing at this repository and this workflow filename.
      - name: Ensure npm is new enough for trusted publishing
        run: npm install -g npm@latest

      - name: Publish with provenance
        run: npm publish --provenance --access public

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
